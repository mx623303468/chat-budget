name = "chat-budget-api"
main = "src/index.ts"
compatibility_date = "2025-05-30"

[[d1_databases]]
binding = "DB"
database_name = "chat-budget"
database_id = "placeholder-change-me"

[vars]
ENVIRONMENT = "development"
JWT_SECRET = "dev-jwt-secret-do-not-use-in-production"
REFRESH_SECRET = "dev-refresh-secret-do-not-use-in-production"

[durable_objects]
bindings = [
  { name = "SYNC_DO", class_name = "SyncDO" }
]

[[migrations]]
tag = "v1"
new_classes = ["SyncDO"]
