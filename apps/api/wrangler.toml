name = "chat-budget-api"
main = "src/index.ts"
compatibility_date = "2025-05-30"
assets = { directory = "../web/dist", binding = "ASSETS", not_found_handling = "single-page-application" }

[[d1_databases]]
binding = "DB"
database_name = "chat-budget"
database_id = "b91768c2-1785-40f6-8021-6148153923e3"

[vars]
ENVIRONMENT = "production"

[[r2_buckets]]
binding = "AVATARS"
bucket_name = "chat-budget-avatars"

[durable_objects]
bindings = [
  { name = "SYNC_DO", class_name = "SyncDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SyncDO"]
